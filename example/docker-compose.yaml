services:
  fuseki:
    image: aksw/fuseki-plus:6.2.0-3
    environment:
      # UID:GID the server runs as; the base image's run-as.sh chowns /fuseki/run
      # to match on start. Do NOT also set `user:` - the chown phase needs root.
      # Set these to your host user's ids (see .env.example).
      - WANT_UID=${WANT_UID:-1000}
      - WANT_GID=${WANT_GID:-1000}
      # Adjust memory usage to your needs!
      - JVM_ARGS=-Xmx1G -Dderby.stream.error.file=/fuseki/run/logs/fuseki_derby.log --enable-native-access=ALL-UNNAMED --add-modules jdk.incubator.vector -Djavax.net.ssl.trustStore=/fuseki/run/security/ldap-truststore.jks -Djavax.net.ssl.trustStorePassword=changeit
      - FUSEKI_BASE=/fuseki/run
      # Optional: only needed by plugins that control other containers (e.g. Qlever).
      # group_add:
      #   - "${DOCKER_GID}"
    volumes:
      # Writable data volume: TDB2 databases, logs, active plugins (extra/), and
      # the config files that init.d copies in.
      - ./run:/fuseki/run
      # Host-supplied configuration, read-only. Copied into /fuseki/run on every
      # start by init.d/10-copy-config.sh (host is the source of truth).
      - ./input:/fuseki/user-input:ro
      # Static resource inputs (ontology, graphql schema, ...), read-only. Mounted
      # at the top level so the kernel never creates root-owned files in the data
      # volume; init.d/20-link-resources.sh links /fuseki/run/resources here.
      - ./resources:/fuseki/resources:ro
      # User init.d scripts, run as root before the server starts.
      - ./init.d:/fuseki/init.d
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 3030:3030
      - 5005:5005
    restart: unless-stopped
